server {
    listen 80;
    server_name groovy.local groovy.lan;

    # Keep Groovy private until a public hostname, TLS certificate, and access policy are chosen.
    # Replace these examples with your LAN, VPN, and Docker bridge ranges.
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 127.0.0.1;
    deny all;

    client_max_body_size 1G;

    location / {
        proxy_pass http://mp3-platform:4318;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 80;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_request_buffering off;
    }
}
